name: Terraform Plan Reviewer Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADK/terraform-plan-reviewer
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_IN_AUTOMATION: "true"
      MODEL: gemini-2.5-flash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Generate Terraform Cloud plan
        run: |
          terraform -chdir=terraform/gcs-sample init -input=false
          terraform -chdir=terraform/gcs-sample plan -input=false -no-color > terraform-cloud-plan.txt

      - name: Review Terraform Cloud plan with ADK agent
        run: |
          python run_review.py < terraform-cloud-plan.txt > terraform-cloud-review.json
          echo "Advisory plan review completed; it does not authorize terraform apply."
