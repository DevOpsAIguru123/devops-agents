name: Terraform Drift Detector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADK/terraform-drift-detector
    env:
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_IN_AUTOMATION: "true"
      MODEL: gemini-2.5-flash
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.7

      - name: Generate Terraform Cloud refresh-only plan
        run: |
          set +e
          terraform -chdir=../terraform-plan-reviewer/terraform/gcs-sample init -input=false
          terraform -chdir=../terraform-plan-reviewer/terraform/gcs-sample plan \
            -refresh-only -detailed-exitcode -input=false -no-color > drift-plan.txt
          tf_status=$?
          echo "terraform_exit_code=${tf_status}" > drift-status.env
          if [ "${tf_status}" -eq 1 ]; then
            exit 1
          fi

      - name: Review drift plan with ADK agent
        run: |
          python run_drift_review.py < drift-plan.txt > drift-review.json
          echo "Advisory drift review completed; raw plan and model output were not written to the job log."

      - name: Notify Discord when drift is detected
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          status = dict(
              line.strip().split("=", 1)
              for line in open("drift-status.env")
              if "=" in line
          )
          if status.get("terraform_exit_code") != "2":
              print("No drift detected; Discord notification skipped.")
              raise SystemExit(0)

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          message = f"Terraform reported infrastructure drift. Review the protected workflow run: {run_url}"
          payload = json.dumps({"content": message}).encode()
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "github-actions-terraform-drift-detector",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord notification status:", response.status)
          except urllib.error.HTTPError as exc:
              print("Discord notification failed:", exc.code, exc.reason)
              print(exc.read().decode("utf-8", errors="replace"))
              raise
          PY
