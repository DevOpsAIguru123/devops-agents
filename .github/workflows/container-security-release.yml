name: Container security release

on:
  pull_request:
    paths:
      - "ADK/container-hardening/app/**"
      - "ADK/container-hardening/examples/agentic-devops-portfolio/**"
      - "ADK/container-hardening/scripts/**"
      - "ADK/container-hardening/pyproject.toml"
      - "ADK/container-hardening/uv.lock"
      - ".github/workflows/container-security-release.yml"
  push:
    branches:
      - main
    paths:
      - "ADK/container-hardening/app/**"
      - "ADK/container-hardening/examples/agentic-devops-portfolio/**"
      - "ADK/container-hardening/scripts/**"
      - "ADK/container-hardening/pyproject.toml"
      - "ADK/container-hardening/uv.lock"
      - ".github/workflows/container-security-release.yml"
  workflow_dispatch:
    inputs:
      dockerfile:
        description: Image definition to build and scan
        required: true
        default: Dockerfile
        type: choice
        options:
          - Dockerfile
          - Dockerfile.vulnerable
      publish:
        description: Publish after every quality and security gate passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write

concurrency:
  group: container-security-release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: ADK/container-hardening/examples/agentic-devops-portfolio
  LOCAL_IMAGE: agentic-devops-portfolio-ci:${{ github.sha }}
  SELECTED_DOCKERFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.dockerfile || 'Dockerfile' }}

jobs:
  sonarqube:
    name: SonarQube quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Require SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "Missing SONAR_TOKEN repository secret"; exit 1; }
          test -n "$SONAR_HOST_URL" || { echo "Missing SONAR_HOST_URL repository secret"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "Missing SONAR_ORGANIZATION repository secret"; exit 1; }

      - name: Analyze source with SonarQube
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          projectBaseDir: ${{ env.APP_DIR }}
          args: >-
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Enforce SonarQube quality gate
        # SonarCloud has no feature-branch gate on the current plan. Enforce the
        # gate only for the trusted main branch, where publishing is possible.
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: ${{ env.APP_DIR }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  container-security:
    name: Build, scan, and authorize
    needs: sonarqube
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare reports and selected configuration
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p reports .ci-config-scan
          cp "$SELECTED_DOCKERFILE" .ci-config-scan/Dockerfile
          if [ "$SELECTED_DOCKERFILE" = "Dockerfile.vulnerable" ]; then
            cp deployment.vulnerable.yaml .ci-config-scan/deployment.yaml
          fi

      - name: Build local candidate without publishing
        working-directory: ${{ env.APP_DIR }}
        run: >-
          docker build
          --file "$SELECTED_DOCKERFILE"
          --tag "$LOCAL_IMAGE"
          .

      - name: Generate Trivy image vulnerability and secret report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE }}
          scanners: vuln,secret
          format: json
          output: ${{ env.APP_DIR }}/reports/ci-image-trivy.json
          exit-code: "0"
          version: v0.72.0

      - name: Generate separate Trivy configuration report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ env.APP_DIR }}/.ci-config-scan
          scanners: misconfig
          format: json
          output: ${{ env.APP_DIR }}/reports/ci-config-trivy.json
          exit-code: "0"
          version: v0.72.0
          skip-setup-trivy: true

      - name: Apply deterministic release policy
        id: release-policy
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: >-
          python3 scripts/evaluate_release.py
          --image-report reports/ci-image-trivy.json
          --config-report reports/ci-config-trivy.json
          --output reports/ci-policy-decision.json

      - name: Triage every Trivy finding and publish the run summary
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 scripts/triage_trivy.py \
            --image-report reports/ci-image-trivy.json \
            --config-report reports/ci-config-trivy.json \
            --policy-report reports/ci-policy-decision.json \
            --dockerfile "$SELECTED_DOCKERFILE" \
            --json-output reports/ci-triage.json \
            --markdown-output reports/ci-triage.md \
            --sarif-output reports/ci-trivy.sarif
          cat reports/ci-triage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Send Trivy findings to GitHub Code Scanning
        if: always() && hashFiles('ADK/container-hardening/examples/agentic-devops-portfolio/reports/ci-trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: ${{ env.APP_DIR }}/reports/ci-trivy.sarif
          category: trivy-container-security

      - name: Upload scan evidence even when policy blocks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-reports-${{ github.run_id }}
          path: |
            ${{ env.APP_DIR }}/reports/ci-image-trivy.json
            ${{ env.APP_DIR }}/reports/ci-config-trivy.json
            ${{ env.APP_DIR }}/reports/ci-policy-decision.json
            ${{ env.APP_DIR }}/reports/ci-triage.json
            ${{ env.APP_DIR }}/reports/ci-triage.md
            ${{ env.APP_DIR }}/reports/ci-trivy.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce release policy and required reporting
        if: always()
        working-directory: ${{ env.APP_DIR }}
        env:
          RELEASE_POLICY_OUTCOME: ${{ steps.release-policy.outcome }}
        run: |
          test "$RELEASE_POLICY_OUTCOME" = "success" || {
            echo "Release policy blocked this candidate"
            exit 1
          }
          test -s reports/ci-triage.json
          test -s reports/ci-triage.md
          test -s reports/ci-trivy.sarif

      - name: Package the authorized local image
        working-directory: ${{ env.APP_DIR }}
        run: docker save --output reports/release-image.tar "$LOCAL_IMAGE"

      - name: Upload authorized release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authorized-container-${{ github.run_id }}
          path: |
            ${{ env.APP_DIR }}/reports/release-image.tar
            ${{ env.APP_DIR }}/reports/ci-policy-decision.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  agent-triage:
    name: ADK agent advisory triage
    needs: container-security
    if: always() && needs.container-security.result != 'skipped'
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download deterministic triage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-security-reports-${{ github.run_id }}
          path: ADK/container-hardening/.ci-agent-input

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ADK/container-hardening/uv.lock

      - name: Install locked ADK dependencies
        working-directory: ADK/container-hardening
        run: uv sync --frozen --no-dev

      - name: Authenticate to Google Cloud with Workload Identity Federation
        # The WIF provider intentionally trusts only the release branch.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Run Vertex AI ADK advisory agent
        working-directory: ADK/container-hardening
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "true"
          GOOGLE_CLOUD_PROJECT: ${{ github.event_name != 'pull_request' && secrets.GOOGLE_CLOUD_PROJECT || '' }}
          GOOGLE_CLOUD_LOCATION: "global"
          # PR code never receives cloud credentials. Trusted runs use short-lived WIF ADC.
        run: >-
          uv run --no-sync python scripts/run_ci_agent.py
          --triage-report .ci-agent-input/ci-triage.json
          --json-output reports/ci-agent-review.json
          --markdown-output reports/ci-agent-review.md

      - name: Publish agent review in the run summary
        if: always() && hashFiles('ADK/container-hardening/reports/ci-agent-review.md') != ''
        run: cat ADK/container-hardening/reports/ci-agent-review.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload agent advisory report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-agent-review-${{ github.run_id }}
          path: |
            ADK/container-hardening/reports/ci-agent-review.json
            ADK/container-hardening/reports/ci-agent-review.md
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish authorized image
    needs:
      - sonarqube
      - container-security
      - agent-triage
    if: >-
      always() &&
      needs.sonarqube.result == 'success' &&
      needs.container-security.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download authorized release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: authorized-container-${{ github.run_id }}
          path: release

      - name: Verify explicit policy authorization
        run: >-
          python3 -c
          'import json; from pathlib import Path;
          d=json.loads(Path("release/ci-policy-decision.json").read_text());
          assert d.get("policy_decision") == "approved" and d.get("publish_allowed") is True,
          "release policy did not authorize publishing"'

      - name: Require Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Missing DOCKERHUB_USERNAME repository variable"; exit 1; }
          test -n "$DOCKERHUB_REPOSITORY" || { echo "Missing DOCKERHUB_REPOSITORY repository variable"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Missing DOCKERHUB_TOKEN repository secret"; exit 1; }
          case "$DOCKERHUB_USERNAME" in *[!a-z0-9_-]*|'') echo "Invalid Docker Hub username"; exit 1;; esac
          case "$DOCKERHUB_REPOSITORY" in *[!a-z0-9._-]*|'') echo "Invalid Docker Hub repository"; exit 1;; esac

      - name: Load the exact scanned image
        run: docker load --input release/release-image.tar

      - name: Authenticate to Docker Hub only after authorization
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push immutable and latest tags
        env:
          RELEASE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
        run: |
          docker tag "$LOCAL_IMAGE" "$RELEASE_REPOSITORY:$GITHUB_SHA"
          docker tag "$LOCAL_IMAGE" "$RELEASE_REPOSITORY:latest"
          docker push "$RELEASE_REPOSITORY:$GITHUB_SHA"
          docker push "$RELEASE_REPOSITORY:latest"
